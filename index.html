<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batalha naval</title>
</head>
<body>
  <!--
    ESQUELETO DA TELA (contrato da seção 3 do PLANEJAMENTO.md).
    Elementos fixos, VAZIOS: sem texto, sem valor e sem atributos de estado
    (data-estado, disabled, hidden). Os testes abrem este HTML.
    As casas (meu-XN, alvo-XN) e a lista de navios (frota-X) seriam criadas pelo jogo, que não é implementado.
  -->
  <section>
    <div data-testid="lista-frota"></div>
    <button data-testid="btn-orientacao"></button>
    <button data-testid="btn-aleatorio"></button>
    <button data-testid="btn-comecar"></button>
    <button data-testid="btn-nova-partida"></button>
  </section>
  <main>
    <div data-testid="tabuleiro-meu"></div>
    <div data-testid="tabuleiro-alvo"></div>
  </main>
  <footer>
    <span data-testid="vez"></span>
    <span data-testid="placar-meus"></span>
    <span data-testid="placar-cpu"></span>
    <span data-testid="tiros"></span>
    <span data-testid="acertos"></span>
    <p data-testid="mensagem"></p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
